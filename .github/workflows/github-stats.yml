name: Generate GitHub Stats
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout github-stats generator
        uses: actions/checkout@v4
        with:
          repository: jstrieb/github-stats
          path: github-stats-src

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install requirements
        run: |
          cd github-stats-src
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install -r requirements.txt

      - name: Generate images
        run: |
          cd github-stats-src
          python3 generate_images.py
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: chekshith
          EXCLUDED: ""
          EXCLUDED_LANGS: ""
          EXCLUDE_FORKED_REPOS: false

      - name: Copy generated images into this repo
        run: |
          mkdir -p generated
          cp github-stats-src/generated/*.svg generated/

      - name: Commit to the repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add generated/*.svg
          git commit -m "Update generated GitHub stats" || echo "No changes to commit"
          git push
